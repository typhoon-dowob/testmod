name: Build Minecraft 1.20.1 Forge mod

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack source ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f 'WoolTest-1.20.1-Forge-GitHub-Ready.zip' ]]; then
            archive='WoolTest-1.20.1-Forge-GitHub-Ready.zip'
          elif [[ -f 'WoolTest-1.20.1-Forge-v0.1.0-source.zip' ]]; then
            archive='WoolTest-1.20.1-Forge-v0.1.0-source.zip'
          else
            echo '::error::Upload the WoolTest source ZIP to the repository root without renaming it.'
            exit 1
          fi
          unzip -q "$archive" -d ci-source
          dir='ci-source'
          if [[ ! -f "$dir/build.gradle" ]]; then
            dir="$dir/WoolTest-1.20.1-Forge"
          fi
          if [[ ! -f "$dir/build.gradle" || ! -f "$dir/tools/bootstrap.sh" ]]; then
            echo '::error::Cannot find the mod project inside the ZIP.'
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Using project: $dir"

      - name: Build mod JAR
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bootstrap.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace clean build 2>&1 | tee -a "$GITHUB_WORKSPACE/build-log.txt"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: wooltest-minecraft-1.20.1-forge
          path: ${{ steps.project.outputs.dir }}/build/libs/wooltest-1.20.1-0.1.0.jar
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wooltest-build-log
          path: build-log.txt
          if-no-files-found: ignore
